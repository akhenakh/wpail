name: Publish Go Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    # macOS runner: the darwin/arm64 build uses cgo (libproc); the Linux
    # builds stay static (CGO_ENABLED=0) and cross-compile from here.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Release
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Homebrew formula
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          scripts/brew-bump.sh "${GITHUB_REF#refs/tags/}"
