version: "3"

vars:
  BIN: bin/wpail
  LDFLAGS: -s -w

tasks:
  build:
    desc: Build a static stripped binary into bin/
    cmds:
      - CGO_ENABLED=0 go build -trimpath -ldflags "{{.LDFLAGS}}" -o {{.BIN}} .
    sources:
      - "*.go"
      - listen/*.go
      - tui/*.go
      - go.mod
      - go.sum
    generates:
      - "{{.BIN}}"

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  fix:
    desc: Apply go fix modernizations
    cmds:
      - go fix ./...

  fmt:
    desc: Format all Go files
    cmds:
      - gofmt -l -w .

  check:
    desc: vet + fix-check + test + build (pre-commit gate)
    deps: [vet]
    cmds:
      - go fix ./...
      - task: test
      - task: build

  tidy:
    desc: Reconcile go.mod/go.sum
    cmds:
      - go mod tidy

  run:
    desc: Run against this machine — pass args after -- e.g. `task run -- 6666`
    cmds:
      - go run . {{.CLI_ARGS}}

  install-bin:
    desc: Install into $GOPATH/bin
    cmds:
      - CGO_ENABLED=0 go install -trimpath .

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin
